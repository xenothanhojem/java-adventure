  - id: typescript.react.security.audit.react-unsanitized-property.react-unsanitized-property
    message: Detection of $HTML from non-constant definition. This can inadvertently
      expose users to cross-site scripting (XSS) attacks if this comes from
      user-provided input. If you have to use $HTML, consider using a
      sanitization library such as DOMPurify to sanitize your HTML.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')"
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
      references:
        - https://react.dev/reference/react-dom/components/common#dangerously-setting-the-inner-html
      category: security
      confidence: MEDIUM
      technology:
        - react
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: MEDIUM
    languages:
      - typescript
      - javascript
    severity: WARNING
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  function ...({..., $X, ...}) { ... }
              - pattern-inside: |
                  function ...(..., $X, ...) { ... }
          - focus-metavariable: $X
          - pattern-either:
              - pattern: $X.$Y
              - pattern: $X[...]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $BODY = $REACT.useRef(...)
                  ...
              - pattern-inside: |
                  $BODY = useRef(...)
                  ...
              - pattern-inside: |
                  $BODY = findDOMNode(...)
                  ...
              - pattern-inside: |
                  $BODY = createRef(...)
                  ...
              - pattern-inside: |
                  $BODY = $REACT.findDOMNode(...)
                  ...
              - pattern-inside: |
                  $BODY = $REACT.createRef(...)
                  ...
          - pattern-either:
              - pattern: |
                  $BODY. ... .$HTML = $SINK
              - pattern: |
                  $BODY.$HTML = $SINK
          - metavariable-regex:
              metavariable: $HTML
              regex: (innerHTML|outerHTML)
          - focus-metavariable: $SINK
      - patterns:
          - pattern-either:
              - pattern: ReactDOM.findDOMNode(...).$HTML = $SINK
          - metavariable-regex:
              metavariable: $HTML
              regex: (innerHTML|outerHTML)
          - focus-metavariable: $SINK
    pattern-sanitizers:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $S from "underscore.string"
                  ...
              - pattern-inside: |
                  import * as $S from "underscore.string"
                  ...
              - pattern-inside: |
                  import $S from "underscore.string"
                  ...
              - pattern-inside: |
                  $S = require("underscore.string")
                  ...
          - pattern-either:
              - pattern: $S.escapeHTML(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $S from "dompurify"
                  ...
              - pattern-inside: |
                  import { ..., $S,... } from "dompurify"
                  ...
              - pattern-inside: |
                  import * as $S from "dompurify"
                  ...
              - pattern-inside: |
                  $S = require("dompurify")
                  ...
              - pattern-inside: |
                  import $S from "isomorphic-dompurify"
                  ...
              - pattern-inside: |
                  import * as $S from "isomorphic-dompurify"
                  ...
              - pattern-inside: |
                  $S = require("isomorphic-dompurify")
                  ...
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      $VALUE = $S(...)
                      ...
                  - pattern: $VALUE.sanitize(...)
              - patterns:
                  - pattern-inside: |
                      $VALUE = $S.sanitize
                      ...
                  - pattern: $S(...)
              - pattern: $S.sanitize(...)
              - pattern: $S(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $S from 'xss';
                  ...
              - pattern-inside: |
                  import * as $S from 'xss';
                  ...
              - pattern-inside: |
                  $S = require("xss")
                  ...
          - pattern: $S(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $S from 'sanitize-html';
                  ...
              - pattern-inside: |
                  import * as $S from "sanitize-html";
                  ...
              - pattern-inside: |
                  $S = require("sanitize-html")
                  ...
          - pattern: $S(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $S = new Remarkable()
                  ...
          - pattern: $S.render(...)
  - id: typescript.react.security.react-insecure-request.react-insecure-request
    message: Unencrypted request over HTTP detected.
    metadata:
      vulnerability: Insecure Transport
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      references:
        - https://www.npmjs.com/package/axios
      category: security
      technology:
        - react
      subcategory:
        - vuln
      likelihood: LOW
      impact: MEDIUM
      confidence: MEDIUM
    languages:
      - typescript
      - javascript
    severity: ERROR
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $AXIOS from 'axios';
                  ...
                  $AXIOS.$METHOD(...)
              - pattern-inside: |
                  $AXIOS = require('axios');
                  ...
                  $AXIOS.$METHOD(...)
          - pattern-either:
              - pattern: $AXIOS.get("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
              - pattern: $AXIOS.post("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
              - pattern: $AXIOS.delete("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
              - pattern: $AXIOS.head("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
              - pattern: $AXIOS.patch("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
              - pattern: $AXIOS.put("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
              - pattern: $AXIOS.options("=~/[Hh][Tt][Tt][Pp]:\/\/.*/",...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $AXIOS from 'axios';
                  ...
                  $AXIOS(...)
              - pattern-inside: |
                  $AXIOS = require('axios');
                  ...
                  $AXIOS(...)
          - pattern-either:
              - pattern: '$AXIOS({url: "=~/[Hh][Tt][Tt][Pp]:\/\/.*/"}, ...)'
              - pattern: |
                  $OPTS = {url: "=~/[Hh][Tt][Tt][Pp]:\/\/.*/"}
                  ...
                  $AXIOS($OPTS, ...)
      - pattern: fetch("=~/[Hh][Tt][Tt][Pp]:\/\/.*/", ...)
  - id: typescript.react.security.react-markdown-insecure-html.react-markdown-insecure-html
    message: Overwriting `transformLinkUri` or `transformImageUri` to something
      insecure, or turning `allowDangerousHtml` on, or turning `escapeHtml` off,
      will open the code up to XSS vectors.
    metadata:
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation
          ('Cross-site Scripting')"
      owasp:
        - A07:2017 - Cross-Site Scripting (XSS)
        - A03:2021 - Injection
      references:
        - https://www.npmjs.com/package/react-markdown#security
      category: security
      technology:
        - react
      cwe2022-top25: true
      cwe2021-top25: true
      subcategory:
        - audit
      likelihood: LOW
      impact: LOW
      confidence: LOW
    languages:
      - typescript
      - javascript
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern-inside: |
              $X = require('react-markdown/with-html');
              ...
          - pattern-inside: |
              $X = require('react-markdown');
              ...
          - pattern-inside: |
              import 'react-markdown/with-html';
              ...
          - pattern-inside: |
              import 'react-markdown';
              ...
      - pattern-either:
          - pattern: |
              <$EL allowDangerousHtml />
          - pattern: |
              <$EL escapeHtml={false} />
          - pattern: |
              <$EL transformLinkUri=... />
          - pattern: |
              <$EL transformImageUri=... />
  - id: yaml.argo.security.argo-workflow-parameter-command-injection.argo-workflow-parameter-command-injection
    message: Using input or workflow parameters in here-scripts can lead to command
      injection or code injection. Convert the parameters to env variables
      instead.
    languages:
      - yaml
    metadata:
      category: security
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS
          Command ('OS Command Injection')"
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp:
        - A03:2021 – Injection
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://github.com/argoproj/argo-workflows/issues/5061
        - https://github.com/argoproj/argo-workflows/issues/5114#issue-808865370
      technology:
        - ci
        - argo
    severity: ERROR
    patterns:
      - pattern-inside: |
          apiVersion: $VERSION
          ...
      - metavariable-regex:
          metavariable: $VERSION
          regex: (argoproj.io.*)
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  command:
                    ...
                    - python
                    ...
                  ...
                  source: 
                    $SCRIPT
              - focus-metavariable: $SCRIPT
              - metavariable-pattern:
                  metavariable: $SCRIPT
                  language: python
                  patterns:
                    - pattern: |
                        $FUNC(..., $PARAM, ...)
                    - metavariable-pattern:
                        metavariable: $PARAM
                        pattern-either:
                          - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
                          - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
          - patterns:
              - pattern-inside: |
                  command:
                    ...
                    - $LANG
                    ...
                  ...
                  source: 
                    $SCRIPT
              - metavariable-regex:
                  metavariable: $LANG
                  regex: (bash|sh)
              - focus-metavariable: $SCRIPT
              - metavariable-pattern:
                  metavariable: $SCRIPT
                  language: bash
                  patterns:
                    - pattern: |
                        $CMD ... $PARAM  ...
                    - metavariable-pattern:
                        metavariable: $PARAM
                        pattern-either:
                          - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
                          - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
          - patterns:
              - pattern-inside: |
                  container:
                    ...
                    command: $LANG
                    ...
                    args: $PARAM
              - metavariable-regex:
                  metavariable: $LANG
                  regex: .*(sh|bash|ksh|csh|tcsh|zsh).*
              - metavariable-pattern:
                  metavariable: $PARAM
                  pattern-either:
                    - pattern-regex: (.*{{.*inputs.parameters.*}}.*)
                    - pattern-regex: (.*{{.*workflow.parameters.*}}.*)
              - focus-metavariable: $PARAM
  - id: yaml.docker-compose.security.privileged-service.privileged-service
    patterns:
      - pattern-inside: |
          version: ...
          ...
          services:
            ...
            $SERVICE:
              ...
              privileged: $TRUE
      - focus-metavariable: $TRUE
      - metavariable-regex:
          metavariable: $TRUE
          regex: (true)
    fix: |
      false
    message: Service '$SERVICE' is running in privileged mode. This grants the
      container the equivalent of root capabilities on the host machine. This
      can lead to container escapes, privilege escalation, and other security
      concerns. Remove the 'privileged' key to disable this capability.
    metadata:
      cwe:
        - "CWE-250: Execution with Unnecessary Privileges"
      owasp:
        - A06:2017 - Security Misconfiguration
        - A05:2021 - Security Misconfiguration
      references:
        - https://www.trendmicro.com/en_us/research/19/l/why-running-a-privileged-container-in-docker-is-a-bad-idea.html
        - https://containerjournal.com/topics/container-security/why-running-a-privileged-container-is-not-a-good-idea/
      category: security
      technology:
        - docker-compose
      license: Commons Clause License Condition v1.0[LGPL-2.1-only]
      subcategory:
        - vuln
      likelihood: HIGH
      impact: HIGH
      confidence: HIGH
    languages:
      - yaml
    severity: WARNING
  - id: yaml.openapi.security.use-of-basic-authentication.use-of-basic-authentication
    languages:
      - yaml
    message: Basic authentication is considered weak and should be avoided.  Use a
      different authentication scheme, such of OAuth2, OpenID Connect, or mTLS.
    severity: ERROR
    patterns:
      - pattern-inside: |
          openapi: $VERSION
          ...
          components:
            ...
            securitySchemes:
              ...
              $SCHEME:
                ...
      - metavariable-regex:
          metavariable: $VERSION
          regex: 3.*
      - pattern: |
          type: http
          ...
          scheme: basic
    metadata:
